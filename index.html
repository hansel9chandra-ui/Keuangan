<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3157D5"><title>Uang Manager</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fb;color:#20242b}.app{max-width:520px;margin:auto;padding:22px 18px 40px}h1{margin:4px 0 5px;font-size:29px}.sub,.small{color:#68707d}.card{border-radius:18px;padding:18px;margin:12px 0}.makan{background:#e8f5e9}.jajan{background:#fff3e0}.kuliah{background:#e8eaf6}.name{font-weight:700;font-size:18px}.balance{font-size:25px;font-weight:700;margin:10px 0 14px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:#3157d5;color:white}.secondary{background:white;color:#3157d5;border:1px solid #dbe1ee}.total{background:#ede7f6;border-radius:18px;padding:20px;margin-top:15px}.total b{font-size:25px}.actions{display:flex;gap:10px;margin:16px 0}.actions button{flex:1}.history{margin-top:24px}.tx{background:white;border-radius:14px;padding:13px;margin:8px 0;display:flex;justify-content:space-between}input,select{width:100%;padding:13px;margin:7px 0 13px;border:1px solid #d5dbe6;border-radius:10px;font-size:16px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center}.sheet{background:white;width:min(520px,100%);border-radius:22px 22px 0 0;padding:22px}</style></head><body><div class="app"><h1>Uang Manager</h1><div class="sub">Kelola uang makan, jajan, dan kuliah.</div><div id="cards"></div><div class="total">TOTAL SALDO<br><b id="total">Rp0</b></div><div class="actions"><button onclick="openModal('expense')">+ Pengeluaran</button><button class="secondary" onclick="openModal('income')">+ Tambah Uang</button></div><button class="secondary" style="width:100%" onclick="resetData()">Atur Ulang Semua Saldo</button><div class="history"><h2>Riwayat Transaksi</h2><div id="history"></div></div></div>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle"></h2><label>Kategori</label><select id="cat"><option value="makan">Uang Makan</option><option value="jajan">Uang Jajan</option><option value="kuliah">Uang Kuliah</option></select><label>Nominal (Rp)</label><input id="amount" type="number" min="1" placeholder="Contoh: 25000"><label>Keterangan</label><input id="note" placeholder="Contoh: makan siang"><div class="actions"><button onclick="saveTx()">Simpan</button><button class="secondary" onclick="closeModal()">Batal</button></div></div></div>
<script>
const KEY='uang-manager-v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{makan:0,jajan:0,kuliah:0,history:[]};const names={makan:'Uang Makan',jajan:'Uang Jajan',kuliah:'Uang Kuliah'},cls={makan:'makan',jajan:'jajan',kuliah:'kuliah'};let mode='expense';const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function render(){let c=document.getElementById('cards');c.innerHTML='';['makan','jajan','kuliah'].forEach(k=>c.innerHTML+=`<div class="card ${cls[k]}"><div class="name">${names[k]}</div><div class="balance">${rupiah(data[k])}</div><button onclick="quickExpense('${k}')">Kurangi uang ini</button></div>`);document.getElementById('total').textContent=rupiah(data.makan+data.jajan+data.kuliah);let h=document.getElementById('history');h.innerHTML=data.history.length?data.history.slice().reverse().map(x=>`<div class="tx"><div><b>${names[x.cat]}</b><div class="small">${x.note||'Tanpa keterangan'} · ${x.date}</div></div><b style="color:${x.type==='expense'?'#c62828':'#2e7d32'}">${x.type==='expense'?'-':'+'}${rupiah(x.amount)}</b></div>`).join(''):'<div class="small">Belum ada transaksi.</div>'}
function openModal(m){mode=m;document.getElementById('modalTitle').textContent=m==='expense'?'Tambah Pengeluaran':'Tambah Uang';document.getElementById('amount').value='';document.getElementById('note').value='';document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function quickExpense(k){openModal('expense');document.getElementById('cat').value=k}
function saveTx(){let k=document.getElementById('cat').value,a=Number(document.getElementById('amount').value),note=document.getElementById('note').value.trim();if(!a||a<1)return alert('Masukkan nominal yang valid.');if(mode==='expense'&&a>data[k])return alert('Saldo kategori ini tidak cukup.');data[k]+=mode==='expense'?-a:a;data.history.push({cat:k,amount:a,note,date:new Date().toLocaleString('id-ID'),type:mode});save();closeModal()}
function resetData(){if(!confirm('Semua saldo dan riwayat akan dihapus. Lanjutkan?'))return;let m=prompt('Saldo awal Uang Makan (Rp):','0');if(m===null)return;let j=prompt('Saldo awal Uang Jajan (Rp):','0');if(j===null)return;let k=prompt('Saldo awal Uang Kuliah (Rp):','0');if(k===null)return;data={makan:Number(m)||0,jajan:Number(j)||0,kuliah:Number(k)||0,history:[]};save()}render();
</script></body></html>
